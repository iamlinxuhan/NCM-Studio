name: 构建

# 推 main 时三平台各打一次包，用来尽早暴露某个平台特有的构建问题；
# 打 tag（形如 v1.0.0）时额外把产物发成 Release；
# 也可以在 Actions 页面手动触发。
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      # 一个平台挂了不要连累另外两个，先把能出的产物出出来
      fail-fast: false
      matrix:
        include:
          # ⚠ Linux 必须用 22.04，不要图省事写 ubuntu-latest。
          #
          # PyInstaller 会把**构建机**的系统库（libglib、libgtk、libstdc++、
          # libxcb……）一并收进产物，这些库是在构建机的 glibc 上编译的。用
          # ubuntu-latest（现在是 24.04，glibc 2.39）构建，产物就要求 2.39，
          # 在 Debian 12（2.36）、Ubuntu 22.04（2.35）上直接
          # "version `GLIBC_2.39' not found" 起不来 —— 而构建、上传、发布全程
          # 不报错，等用户下载才发现。
          #
          # 22.04 的 glibc 是 2.35，恰好也是 PyQt6 的 manylinux_2_34 wheel 之
          # 上最低的一档，于是产物的下限就是 2.35。要抬这个数，先想清楚是不是
          # 真的不要老发行版的用户了 —— 下面 check_glibc_floor.py 会卡住。
          - target: linux-x86_64
            os: ubuntu-22.04
            mode: onedir
            artifact: dist/*.AppImage
            bundle_mpv: "1"
          - target: windows-x86_64
            os: windows-latest
            mode: onefile
            artifact: dist/*.exe
            bundle_mpv: "1"
          # macOS 首版**不随包** mpv：官方 git-release 是滚动 tag，旧产物会被
          # 覆盖，无法像另外两个平台那样钉死版本与校验和。这里退回探测系统
          # mpv（brew install mpv），所以 bundle_mpv 留空。
          - target: macos-arm64
            os: macos-latest
            mode: onefile
            artifact: dist/ncmctl-gui-macos-arm64
            bundle_mpv: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.12 三平台都有现成的 PyQt6 与 pywinpty wheel，不用现场编译
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # 版本钉在 ncmgui/__init__.py 的 NCMCTL_VERSION，校验和钉在脚本里。
      # 少这一步产出的就是一个跑不起来的空壳 —— 本程序是 ncmctl 的图形前端，
      # 界面里每个按钮都对应它的一个子命令，缺了它一个功能都用不了。
      - name: 取 ncmctl
        run: python scripts/fetch_ncmctl.py

      # mpv 官方不发静态包，只能装发行版那份，再把 /usr/bin/mpv 与 ldd 闭包
      # 一起收进 vendor/mpv/。版本无需钉死 —— 二进制和它的库是一起收的，
      # 产物自洽；真正需要钉死的是 Windows 那边的下载包（见 fetch_mpv.py）。
      - name: 安装 mpv（Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mpv

      # .7z 解压，仅构建期需要
      - name: 安装 py7zr（Windows）
        if: runner.os == 'Windows'
        run: pip install py7zr

      - name: 取 mpv
        run: python scripts/fetch_mpv.py

      # 这几个自检都是纯函数，不联网、不需要 ncmctl 在场，正好用来卡住
      # 「命令构建层被改坏了」这类问题。歌词那一步还会验一遍 mutagen 的
      # 标签往返 —— 那正是打包时最容易少收东西的地方。
      - name: 离线自检
        run: |
          python -m ncmgui.ncmctl
          python -m ncmgui.resolver
          # IPC 编解码、时长格式化、mpv 定位顺序，都是纯函数
          python -m ncmgui.player
          # 少了 mutagen，歌词那步会打印一句"跳过标签往返测试"然后通过 ——
          # 一个静默跳过等于没测，所以这里先明确它必须在
          python -c "import mutagen"
          python -m ncmgui.lyrics
          # 封面地址改写与 LRU 缓存
          python -m ncmgui.images
          # Release 版本比较、资产名、SHA256SUMS 解析、安装形态分支
          python -m ncmgui.updater

      - name: 打包
        env:
          NCMGUI_MODE: ${{ matrix.mode }}
          NCMGUI_BUILD_NAME: ncmctl-gui-${{ matrix.target }}
          # 缺了 ncmctl 就报错，而不是警告后照常产出 —— 见 spec 里的说明
          NCMGUI_BUNDLE_NCMCTL: "1"
          # Linux / Windows 必须带 mpv；macOS 留空（见上面 matrix 的注释）
          NCMGUI_BUNDLE_MPV: ${{ matrix.bundle_mpv }}
        run: pyinstaller ncmctl-gui.spec --noconfirm

      # ── 下面两步都是在做同一件事：把「打包成功」和「东西真的进去了」分开 ──
      #
      # PyInstaller 少收一个文件时只会警告不会失败，产物照样能构建、能上传、
      # 能发布。所以每个平台都要把产物拆开点名清点。

      # pywinpty 除了 Python 扩展之外还带几个非 .pyd 的二进制（conpty.dll、
      # OpenConsole.exe、winpty.dll、winpty-agent.exe），PyInstaller 的常规依赖
      # 分析看不到它们，全靠 spec 里那句 collect_all("winpty")
      - name: 清点 Windows 产物里的 ConPTY 运行时
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          pyi-archive_viewer -l $exe.FullName > toc.txt
          foreach ($name in 'conpty.dll', 'OpenConsole.exe', 'winpty.dll', 'winpty-agent.exe') {
            if (-not (Select-String -Path toc.txt -SimpleMatch -Pattern $name -Quiet)) {
              throw "产物里没有 $name —— pywinpty 的运行时二进制没被打进去"
            }
          }
          Write-Host "ConPTY 运行时齐全：$($exe.Name)"

      # 单文件包把 ncmctl 压在里面，只能翻归档目录
      - name: 清点单文件包里的 ncmctl
        if: runner.os != 'Linux'
        shell: pwsh
        run: |
          $bin = Get-ChildItem dist/* | Where-Object { -not $_.PSIsContainer } | Select-Object -First 1
          pyi-archive_viewer -l $bin.FullName > toc.txt
          $name = if ($IsWindows) { 'ncmctl.exe' } else { 'ncmctl' }
          if (-not (Select-String -Path toc.txt -SimpleMatch -Pattern $name -Quiet)) {
            throw "产物里没有内置的 $name —— 用户拿到的包一个功能都用不了"
          }
          Write-Host "内置 ncmctl 到位：$($bin.Name)"

      # mpv 也是 binaries 收进去的，落在 mpv/ 目录
      - name: 清点单文件包里的 mpv
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = Get-ChildItem dist/* | Where-Object { -not $_.PSIsContainer } | Select-Object -First 1
          pyi-archive_viewer -l $bin.FullName > toc-mpv.txt
          if (-not (Select-String -Path toc-mpv.txt -SimpleMatch -Pattern 'mpv/mpv.exe' -Quiet)) {
            throw "产物里没有 mpv/mpv.exe —— 流媒体播放在新机器上会不可用"
          }
          Write-Host "内置 mpv 到位：$($bin.Name)"

      # onedir 的 ncmctl 是散落的普通文件，检查执行位比翻归档更实在
      # （binaries 会被无条件 chmod 0755，datas 不会 —— 见 spec 里的说明）
      - name: 组装 AppImage
        if: runner.os == 'Linux'
        env:
          NCMGUI_MAX_GLIBC: "2.35"
        run: |
          test -x dist/ncmctl-gui-linux-x86_64/_internal/ncmctl \
            || { echo "产物里的 ncmctl 缺失或不可执行"; exit 1; }
          test -x dist/ncmctl-gui-linux-x86_64/_internal/mpv/mpv \
            || { echo "产物里的 mpv 缺失或不可执行"; exit 1; }
          bash packaging/make_appimage.sh \
            dist/ncmctl-gui-linux-x86_64 \
            dist/ncmctl-gui-linux-x86_64.AppImage

      # 真跑一次。前面那些清点只能证明文件在，证明不了它能启动 ——
      # AppRun 的可执行文件名、内置路径解析、Qt 平台插件，全都要跑起来才知道。
      - name: 冒烟测试
        if: runner.os == 'Linux'
        run: |
          # runner 是个没装图形栈的服务器镜像，而 Qt 的 .so 是**硬链接**到
          # libGL/libEGL 的（NEEDED，不是 dlopen）：宿主没有这两个，动态链接器
          # 在 import PyQt6 那一行就直接拒绝加载，连 offscreen 都跑不到。
          #
          # 补在 runner 上，而不是把 GL 打进产物 —— 那正是 packaging/bundle_libs.py
          # 里「图形驱动必须用用户机器上那份」要避免的（带一份软件渲染的进去会
          # 顶掉用户的硬件加速）。桌面发行版本来就自带这一层，被这道断言拦下的
          # 只有这种精简服务器镜像。
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libgl1 libegl1 libdrm2

          ./dist/ncmctl-gui-linux-x86_64.AppImage --self-test
          # FUSE 不可用时 runtime 会自己降级为解包运行 —— 这条路径专门验一下，
          # 因为很多容器和精简发行版就是没有 /dev/fuse
          ./dist/ncmctl-gui-linux-x86_64.AppImage --appimage-extract-and-run --self-test
          # 文件在、有执行位，都证明不了它能跑：``ldd`` 闭包少一个 .so 时，
          # 失败要到用户点播放才发生。真启动一次 mpv —— 这是唯一可靠的证据
          ./dist/ncmctl-gui-linux-x86_64.AppImage --mpv-version

      - name: 冒烟测试（Windows / macOS）
        if: runner.os != 'Linux'
        shell: pwsh
        run: |
          $bin = Get-ChildItem dist/* | Where-Object { -not $_.PSIsContainer } | Select-Object -First 1

          if ($IsWindows) {
            # spec 里 console=False，所以 Windows 产物是 **GUI 子系统**程序。PowerShell
            # 的 `&` 对这类进程不会等待、也不会设置 $LASTEXITCODE（它保持 $null，
            # 而 `$null -ne 0` 恒真），于是自检明明通过了也会报「退出码 」（后面空的）。
            # 必须用 Start-Process 显式等待再读退出码。
            #
            # 输出重定向到文件而不是让它照常打到控制台：GUI 子系统进程不保证有控制台，
            # 万一没有，自检那几行就白打了 —— 而这个日志正是排查失败的依据。
            $out = Join-Path $env:RUNNER_TEMP 'self-test.log'
            $p = Start-Process -FilePath $bin.FullName -ArgumentList '--self-test' `
              -RedirectStandardOutput $out -RedirectStandardError "$out.err" -PassThru
            # 自检里若抛异常，窗口子系统会弹一个模态对话框、进程永远不返回。
            # 设个上限并说清原因，别让 CI 干等
            if (-not $p.WaitForExit(120000)) {
              $p.Kill()
              # 日志要**先打再抛**：超时正是最需要看日志的那一次，而真正的
              # traceback 就写在重定向出来的错误流里。若等成功之后再读，
              # 失败时留下的只有一句"没有任何输出"，等于把唯一的线索丢掉。
              Get-Content $out -ErrorAction SilentlyContinue | Write-Host
              Get-Content "$out.err" -ErrorAction SilentlyContinue | Write-Host
              throw "自检超过 120 秒没有返回，可能弹出了错误对话框"
            }
            Get-Content $out -ErrorAction SilentlyContinue | Write-Host
            Get-Content "$out.err" -ErrorAction SilentlyContinue | Write-Host
            if ($p.ExitCode -ne 0) { throw "自检失败，退出码 $($p.ExitCode)" }

            # 同样用 Start-Process：--mpv-version 是 GUI 子系统程序的一条
            # 命令行子功能，输出必须重定向，退出码也必须显式等待
            $mpvOut = Join-Path $env:RUNNER_TEMP 'mpv-version.log'
            $m = Start-Process -FilePath $bin.FullName -ArgumentList '--mpv-version' `
              -RedirectStandardOutput $mpvOut -RedirectStandardError "$mpvOut.err" -PassThru
            if (-not $m.WaitForExit(60000)) {
              $m.Kill()
              Get-Content $mpvOut -ErrorAction SilentlyContinue | Write-Host
              Get-Content "$mpvOut.err" -ErrorAction SilentlyContinue | Write-Host
              throw "mpv 版本探测超过 60 秒没有返回"
            }
            Get-Content $mpvOut -ErrorAction SilentlyContinue | Write-Host
            Get-Content "$mpvOut.err" -ErrorAction SilentlyContinue | Write-Host
            if ($m.ExitCode -ne 0) { throw "随包 mpv 起不来，退出码 $($m.ExitCode)" }
          }
          else {
            # macOS 的单文件产物照常继承终端的标准输出，`&` 直接可用
            & $bin.FullName --self-test
            if ($LASTEXITCODE -ne 0) { throw "自检失败，退出码 $LASTEXITCODE" }
          }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ncmctl-gui-${{ matrix.target }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: 发布 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      # gh release create --generate-notes 要读提交历史来生成说明，但
      # download-artifact 只搬产物、不会把仓库带下来，缺了这步 gh 会在空目录里
      # 报 "not a git repository"。fetch-depth: 0 是为了拿到完整历史 —— 默认的
      # 浅克隆只有最近一次提交，生成出来的说明会缺东西。
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          # 产物名已经带了平台后缀，合并到一处不会互相覆盖
          path: dist
          merge-multiple: true

      # 自动更新器按这三个文件名找安装包，缺一个那个平台的用户就永远更新不了；
      # SHA256SUMS 也必须存在 —— 更新器宁可拒绝安装，也不会装一个没校验的文件。
      # 这两个条件在发布前就该失败，而不是等用户点「下载并安装」才发现。
      - name: 校验发布资产
        run: |
          cd dist
          for f in \
            ncmctl-gui-linux-x86_64.AppImage \
            ncmctl-gui-windows-x86_64.exe \
            ncmctl-gui-macos-arm64
          do
            test -f "$f" || { echo "缺少资产：$f"; exit 1; }
          done
          sha256sum \
            ncmctl-gui-linux-x86_64.AppImage \
            ncmctl-gui-windows-x86_64.exe \
            ncmctl-gui-macos-arm64 > SHA256SUMS
          cat SHA256SUMS

      - name: 创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
