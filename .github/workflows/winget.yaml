name: 提交 winget

# 签名后的正式 Release 才会触发：winget 的验证机器人要能匿名下载安装包，
# 草稿状态下的资产对它是 404。本地发布流程（release_sign.py --publish）把草稿
# 转正时，GitHub 会发出 published 事件。
#
# 也可以在 Actions 页面手动跑，填一个已经发布的 tag。
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "已发布的 Release tag（如 v3.0.12）"
        required: true
        type: string

permissions:
  contents: read

jobs:
  submit:
    name: 生成清单并提交 PR
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # 用发布时的那份代码生成清单，别拿 main 上后来改过的脚本
          ref: ${{ github.event.release.tag_name || inputs.tag }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 解析版本并下载安装包
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          $tag = if ($env:RELEASE_TAG) { $env:RELEASE_TAG } else { $env:INPUT_TAG }
          if ($tag -notmatch '^v\d+(\.\d+){1,3}$') {
            throw "tag 格式不对：'$tag'（应形如 v3.0.12）"
          }
          $version = $tag.Substring(1)
          "VERSION=$version" >> $env:GITHUB_ENV

          $dir = 'dist/winget-release'
          New-Item -ItemType Directory -Force $dir | Out-Null
          # 只下安装包：winget 要的是能静默安装、可卸载的 Inno 安装程序，
          # 不是便携版 exe。
          gh release download $tag --pattern 'ncm-studio-windows-x86_64-setup.exe' --dir $dir
          if (-not (Test-Path "$dir/ncm-studio-windows-x86_64-setup.exe")) {
            throw "$tag 里没有 ncm-studio-windows-x86_64-setup.exe"
          }

      - name: 生成 winget 清单
        shell: pwsh
        run: |
          $manifestRoot = 'dist/winget-manifests'
          python scripts/winget_manifests.py `
            --version $env:VERSION `
            --installer 'dist/winget-release/ncm-studio-windows-x86_64-setup.exe' `
            --out $manifestRoot
          if ($LASTEXITCODE -ne 0) { throw "生成清单失败" }
          $manifestDir = Join-Path $manifestRoot "i/iamlinxuhan/NCMStudio/$env:VERSION"
          if (-not (Test-Path $manifestDir)) { throw "找不到清单目录 $manifestDir" }
          "MANIFEST_DIR=$manifestDir" >> $env:GITHUB_ENV

      - name: 提交到 microsoft/winget-pkgs
        shell: pwsh
        env:
          # 需要一个 classic PAT（public_repo 权限）或对 fork 有写权限的
          # fine-grained token。GITHUB_TOKEN 只对本仓库有效，不能开外部 PR。
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINGET_TOKEN)) {
            throw @"
          没有配置 WINGET_TOKEN，无法向 microsoft/winget-pkgs 提交 PR。
          在本仓库 Settings → Secrets and variables → Actions 里添加：
            WINGET_TOKEN = 带 public_repo 权限的 GitHub PAT
          然后手动重跑这个工作流。
          "@
          }

          # 固定版本并校验哈希：这个工具会拿到 PAT，不能每次跑都换一个来路不明
          # 的 latest。升级时同时改 URL 与哈希。
          $url = 'https://github.com/microsoft/winget-create/releases/download/v1.12.13.0/wingetcreate.exe'
          $expected = '24042BD37915805615E6CF969AC57C6439124C3FE85823327F5F3FB24BD9FFEA'
          $tool = Join-Path $env:RUNNER_TEMP 'wingetcreate.exe'
          Invoke-WebRequest -Uri $url -OutFile $tool
          $actual = (Get-FileHash $tool -Algorithm SHA256).Hash
          if ($actual -ne $expected) {
            throw "wingetcreate.exe 校验和不匹配：期望 $expected，实际 $actual"
          }

          & $tool submit `
            --prtitle "New package: iamlinxuhan.NCMStudio version $env:VERSION" `
            --token $env:WINGET_TOKEN `
            --no-open `
            $env:MANIFEST_DIR
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate 提交失败，退出码 $LASTEXITCODE" }
          Write-Host "已向 microsoft/winget-pkgs 提交 PR，等待自动验证。"
